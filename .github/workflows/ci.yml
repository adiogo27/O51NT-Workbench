# CI do O51NT Workbench — espelha ./test.sh: pytest (paralelo + sequencial), Vitest, tsc e Playwright E2E.
# Regra do projeto: tudo verde antes de qualquer merge/implantação; nunca remover um teste para passar.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: pytest (unit + integração)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Bibliotecas de sistema do OpenCV
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libglib2.0-0
      - name: Dependências Python
        run: pip install -r requirements.txt
      - name: pytest -n auto (paralelo)
        run: pytest -n auto -q -p no:warnings
      - name: pytest (sequencial)
        run: pytest -q -p no:warnings

  frontend:
    name: tsc + Vitest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: typecheck (tsc)
        run: npm run --silent typecheck
      - name: Vitest (paridade queryOperators.ts ↔ operators.py)
        run: npm run --silent test:unit

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Bibliotecas de sistema do OpenCV
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libglib2.0-0
      - name: Backend em .venv (o playwright.config.ts sobe .venv/bin/python)
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Dependências do frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Chromium do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build do frontend (backend/static)
        working-directory: frontend
        run: npm run --silent build
      - name: Playwright E2E (backend isolado em :8059, banco temporário, sem rede)
        working-directory: frontend
        run: npm run --silent test:e2e
      - name: Relatório do Playwright (só em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Deploy automático na VPS após merge na main, só com a suíte inteira verde. Requer os segredos gerados por
  # deploy/vps/chave_deploy.sh (VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS); sem eles o job é pulado.
  # A chave na VM é restrita (authorized_keys command=) a: cd /opt/o51nt/app && git pull && bash deploy/vps/03_o51nt.sh
  deploy:
    name: Deploy na VPS (main)
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: producao
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Segredos presentes?
        id: segredos
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_HOST" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::VPS_SSH_KEY/VPS_HOST ausentes: deploy pulado (rode deploy/vps/chave_deploy.sh na VM e grave os segredos)"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Chave e known_hosts
        if: steps.segredos.outputs.ok == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "$VPS_KNOWN_HOSTS" ]; then printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -t ed25519 -H "$VPS_HOST" > ~/.ssh/known_hosts; fi
          chmod 644 ~/.ssh/known_hosts
      - name: git pull + 03_o51nt.sh na VM (comando fixado na chave)
        if: steps.segredos.outputs.ok == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'o51nt' }}
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o BatchMode=yes "$VPS_USER@$VPS_HOST" deploy
